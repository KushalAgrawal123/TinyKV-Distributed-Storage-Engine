# TinyKV router configuration
# Format: key=value, one per line. Lines starting with # are comments.

port=7000

# Comma-separated list of backend tinykv-server addresses (host:port).
# Backends are ordinary, unmodified tinykv-server instances - all
# sharding logic lives in the router.
backends=127.0.0.1:6381,127.0.0.1:6382,127.0.0.1:6383
