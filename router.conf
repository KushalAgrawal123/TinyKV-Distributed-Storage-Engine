# TinyKV router configuration
# Format: key=value, one per line. Lines starting with # are comments.

port=7000

# Where the shard/primary/replica layout lives (see topology.conf).
topology_file=topology.conf

# Health checking / failover (Phase 10C): each shard's primary and
# replica get PINGed this often; a node is declared DOWN after this many
# consecutive misses, which is when a shard with a healthy replica gets
# automatically failed over. See docs/PROTOCOL.md for the full model.
health_check_interval_ms=1000
max_missed_pings=3
