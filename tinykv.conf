# TinyKV default configuration
# Format: key=value, one per line. Lines starting with # are comments.

port=6380

# DEBUG, INFO, WARN, or ERROR
log_level=INFO

# Maximum number of keys before LRU eviction kicks in. 0 = unbounded.
max_keys=0

# Persistence: durability via an append-only file plus periodic
# snapshots, both under `dir` (created automatically if missing).
appendonly=true
dir=./data
dbfilename=dump.tkv
appendfilename=tinykv.aof

# Seconds between automatic snapshots (also resets the AOF). 0 disables
# automatic snapshotting - SAVE still works on demand.
save_interval=300
