# TinyKV router topology - declares each shard's primary and (optional)
# replica. Format: key=value, one per line.
#
# `shards` lists every shard id; each id must then have a
# `<id>.primary=host:port` line and may have a `<id>.replica=host:port`
# line. A shard with no configured replica can still be routed to
# normally, it just has nothing to fail over to if its primary goes down.

shards=shard0,shard1,shard2

shard0.primary=127.0.0.1:6381
shard0.replica=127.0.0.1:6391

shard1.primary=127.0.0.1:6382
shard1.replica=127.0.0.1:6392

shard2.primary=127.0.0.1:6383
shard2.replica=127.0.0.1:6393
